[buildPlans.IosefkaNo_1]
family = "Iosefka No.1"
spacing = "fixed"
serifs = "sans"
noCvSs = true
export-glyph-names = false
noLigation = true

[buildPlans.IosefkaNo_1.variants]
inherits = "ss07"

[buildPlans.IosefkaNo_1.variants.design]
five = "upright-flat-serifless"
eight = "crossing-asymmetric"
zero = "oval-tall-slashed"
capital-g = "flat-bottom-serifless-hooked"
capital-j = "flat-hook-serifed"
capital-k = "straight-serifless"
capital-w = "straight-almost-flat-top-serifless"
a = "double-storey-serifless"
b = "flat-bottom-serifless"
f = "flat-hook-serifless"
g = "single-storey-flat-top-serifless"
i = "serifed"
j = "flat-hook-serifed"
k = "straight-serifless"
l = "serifed-flat-tailed"
q = "flat-top-straight-serifless"
t = "flat-hook-short-neck"
w = "straight-almost-flat-top-serifless"
punctuation-dot = "square"
braille-dot = "square"
caret = "low"
asterisk = "hex-low"
brace = "curly-flat-boundary"

[buildPlans.IosefkaNo_1.metricOverride]
leading = 1110
xHeight = 550

[buildPlans.IosefkaNo_1.widths.Normal]
shape = 550
menu  = 5
css   = "normal"

[buildPlans.IosefkaNo_1.weights.Regular]
shape = 425
menu = 400
css = 400

# [buildPlans.IosefkaNo_1.weights.SemiBold]
# shape = 600
# menu = 600
# css = 600

[buildPlans.IosefkaNo_1.weights.Bold]
shape = 800
menu = 700
css = 700

# [buildPlans.IosefkaNo_1.weights.Heavy]
# shape = 900
# menu = 900
# css = 900

[buildPlans.IosefkaNo_1.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosefkaNo_1.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

################################################################################

